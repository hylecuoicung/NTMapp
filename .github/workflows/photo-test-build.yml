name: "NTM Digital Photo: test build"

# A test build of NTM Digital Photo (the photo/ folder): the installer and portable zip as a workflow
# artifact, nothing published. Releases people's apps are told about come from photo-release.yml.
on:
  workflow_dispatch:

jobs:
  msi:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: photo
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: photo
      - name: Install WiX v5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Show the version the next release would get
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./packaging/windows/next-version.ps1 -TagPrefix photo-
      - name: Build MSI
        shell: pwsh
        run: pwsh packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: ntmdigital-photo-windows-x64
          path: photo/dist/release/*
