name: NTM Digital Editor Release

# Builds the Windows installer and portable zip of the editor (the editor/ folder) under one brand, or
# both, and publishes each as a GitHub release: tagged editor-v<version> for NTM Digital and
# editor-pixel-v<version> for Pixel Digital (brand/*.env). The app looks for a newer release with its
# brand's tag prefix when it starts (editor/crates/ui-egui/src/release_feed.rs) and offers its
# installer for download, so a brand's copies are never offered the other brand's installer.
#
# Run it by hand (Actions > NTM Digital Editor Release > Run workflow), or push a tag such as
# editor-v0.21.0 or editor-pixel-v0.21.0. A release must have a higher version than the one people
# run, or their app offers nothing.

on:
  workflow_dispatch:
    inputs:
      brand:
        description: 'Brand to publish: pixel (Pixel Digital, the default), ntm (NTM Digital) or both (the same version for each).'
        required: false
        type: choice
        options: [pixel, ntm, both]
        default: pixel
      version:
        description: 'Version to publish, e.g. 0.21.0. Empty: major.minor of editor/Cargo.toml, then one more than the last editor release of any brand with that major.minor.'
        required: false
        type: string
  push:
    tags: ['editor-v*', 'editor-pixel-v*']

permissions:
  contents: write

jobs:
  # Which brands, and one version for all of them, decided once before anything is built.
  plan:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      brands: ${{ steps.plan.outputs.brands }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Choose the brands and the version
        id: plan
        shell: pwsh
        env:
          INPUT_BRAND: ${{ inputs.brand }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./brand/brand.ps1
          $ids = @(Get-BrandIds)
          $version = "$env:INPUT_VERSION".Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            # the brand whose tags start like this one
            $tag = $env:GITHUB_REF_NAME
            $brands = @($ids | Where-Object { $tag.StartsWith("$((Get-Brand $_)['EDITOR_TAG_PREFIX'])v") })
            if ($brands.Count -ne 1) { throw "no brand has releases tagged like $tag" }
            $version = $tag.Substring("$((Get-Brand $brands[0])['EDITOR_TAG_PREFIX'])v".Length)
          } else {
            $want = "$env:INPUT_BRAND".Trim()
            if (-not $want) { $want = 'pixel' }
            $brands = if ($want -eq 'both') { $ids } else { @($want) }
            foreach ($b in $brands) { if ($b -notin $ids) { throw "there is no brand '$b' (brand files: $($ids -join ', '))" } }
          }
          if (-not $version) { $version = "$(& ./editor/packaging/windows/next-version.ps1 -App editor | Select-Object -Last 1)".Trim() }
          # Windows Installer versions are three numbers; the last one goes up to 65535.
          if ($version -notmatch '^\d{1,3}\.\d{1,3}\.\d{1,5}$') { throw "version must be three numbers like 0.21.0, got '$version'" }
          foreach ($b in $brands) {
            $tag = "$((Get-Brand $b)['EDITOR_TAG_PREFIX'])v$version"
            gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) { throw "release $tag already exists; choose a higher version" }
            $global:LASTEXITCODE = 0
          }
          "brands=[""$($brands -join '","')""]" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "Publishing the editor $version for: $($brands -join ', ')"

  release:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        brand: ${{ fromJSON(needs.plan.outputs.brands) }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: editor
    env:
      GH_TOKEN: ${{ github.token }}
      # the brand every step builds under: the apps (cargo) and the installer scripts both read it
      NTM_BRAND: ${{ matrix.brand }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editor
          key: ${{ matrix.brand }}
      - name: Install WiX v5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Name the release
        id: names
        shell: pwsh
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ../brand/brand.ps1
          $b = Get-Brand
          "tag=$($b['EDITOR_TAG_PREFIX'])v$env:VERSION" >> $env:GITHUB_OUTPUT
          "product=$($b['EDITOR_PRODUCT'])" >> $env:GITHUB_OUTPUT
          "stem=$($b['EDITOR_EXE'])" >> $env:GITHUB_OUTPUT
          cargo xtask version set $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw 'cargo xtask version set failed' }
          Write-Output "Publishing $($b['EDITOR_PRODUCT']) $env:VERSION as $($b['EDITOR_TAG_PREFIX'])v$env:VERSION"
      - name: Build the installer and portable zip
        shell: pwsh
        env:
          FILMCRAFT_REQUIRE_WINRES: '1'
        run: pwsh packaging/windows/package.ps1 -Arch x64
      - name: Check the installer is still the product people have
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/release -Filter '*.msi' | Select-Object -First 1).FullName
          ../brand/check-identity.ps1 -App editor -Msi $msi
      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem dist/release -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name
          if (-not $files) { throw 'nothing was built in dist/release' }
          $lines = $files | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          [IO.File]::WriteAllText((Join-Path (Resolve-Path dist/release) 'SHA256SUMS.txt'), (($lines -join "`n") + "`n"))
          Get-Content dist/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.stem }}-windows-x64
          path: |
            editor/dist/release/*
      - name: Publish the release
        shell: pwsh
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ steps.names.outputs.tag }}
          PRODUCT: ${{ steps.names.outputs.product }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = (Get-ChildItem dist/release -File).FullName
          $target = @()
          if ($env:GITHUB_REF_TYPE -ne 'tag') { $target = @('--target', $env:GITHUB_SHA) }
          $notes = "$env:PRODUCT $env:VERSION for Windows x64: the installer (.msi), the portable copy (-portable.zip) and their checksums (SHA256SUMS.txt)."
          gh release create $env:TAG @files --repo $env:GITHUB_REPOSITORY @target --title "$env:PRODUCT $env:VERSION" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
